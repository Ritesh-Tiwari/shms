{% extends "base.html" %}

{% block title %}
Delete Patient
{% endblock %}

{% block content %}
<h2>Delete Doctor</h2>

<p>
Are you sure you want to delete
<strong>{{ doctor.user.get_full_name }}</strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button
        type="submit"
        class="btn btn-danger">

        Delete

    </button>

    <a
        href="{% url 'doctors:detail' doctor.pk %}"
        class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
