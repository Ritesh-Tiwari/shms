<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Forgot Password | SHMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: Inter, sans-serif;
        }

        input[type="email"] {
            box-sizing: border-box;
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 0.5rem;
            background: #e5eeff;
            padding: 0 1rem;
            color: #0b1c30;
            outline: none;
        }

        input[type="email"]:focus {
            box-shadow: 0 0 0 2px rgb(0 74 198 / 40%);
            background: #f8f9ff;
        }

        .errorlist {
            margin: 0.5rem 0 0;
            padding: 0;
            list-style: none;
            color: #ba1a1a;
            font-size: 0.875rem;
        }
    </style>
</head>

<body class="min-h-screen bg-[#f8f9ff] text-[#0b1c30] flex items-center justify-center p-4">
    <main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl sm:p-10">
        <div class="mb-8 text-center">
            <div class="mx-auto mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-[#dbe1ff] text-[#004ac6]">
                <span aria-hidden="true" class="material-symbols-outlined">lock_reset</span>
            </div>
            <h1 class="mb-2 text-2xl font-semibold">Forgot your password?</h1>
            <p class="text-sm leading-6 text-[#434655]">
                Enter the email address associated with your account. We’ll send you a secure link to reset your password.
            </p>
        </div>

        <!-- Django validates the address and emails a time-limited reset link when an account matches. -->
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <label class="mb-2 block text-sm font-medium" for="{{ form.email.id_for_label }}">Email address</label>
            {{ form.email }}
            {{ form.email.errors }}

            <button class="mt-6 h-12 w-full rounded-lg bg-[#004ac6] font-medium text-white transition-colors hover:bg-[#2563eb]"
                type="submit">
                Send reset link
            </button>
        </form>

        <p class="mt-6 text-center text-sm">
            <a class="font-medium text-[#004ac6] hover:underline" href="{% url 'accounts:login' %}">Back to sign in</a>
        </p>
    </main>
</body>

</html>
