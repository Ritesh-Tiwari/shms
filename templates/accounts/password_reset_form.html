<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SHMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">
            Forgot Password?
        </h1>

        <p class="text-slate-600 mb-6">
            Enter your registered email address to receive a password-reset link.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="id_email"
                   class="block text-sm font-medium text-slate-700 mb-2">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                id="id_email"
                required
                autocomplete="email"
                class="w-full rounded-lg border border-slate-300 p-3 mb-4 focus:ring-2 focus:ring-blue-500 outline-none"
                placeholder="Enter your registered email"
            >

            {% if form.email.errors %}
                <p class="text-red-600 text-sm mb-3">
                    {{ form.email.errors }}
                </p>
            {% endif %}

            <button
                type="submit"
                class="w-full rounded-lg bg-blue-700 text-white py-3 font-semibold hover:bg-blue-800">
                Send Reset Link
            </button>
        </form>

        <p class="text-center mt-6">
            <a href="{% url 'accounts:login' %}"
               class="text-blue-700 hover:underline">
                Back to Login
            </a>
        </p>
    </div>

</body>
</html>
