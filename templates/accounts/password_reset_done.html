<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Request | SHMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 text-center">
        <h1 class="text-2xl font-bold text-slate-900 mb-4">
            Check Your Email
        </h1>

        <p class="text-slate-600 mb-6">
            If an eligible account exists for the submitted email address,
            password-reset instructions will be sent to that address.
        </p>

        <a href="{% url 'accounts:login' %}"
           class="inline-block rounded-lg bg-blue-700 text-white px-6 py-3 hover:bg-blue-800">
            Back to Login
        </a>
    </div>

</body>
</html>
