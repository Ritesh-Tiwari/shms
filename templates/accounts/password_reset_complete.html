<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Password Updated | SHMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
</head>

<body class="min-h-screen bg-[#f8f9ff] text-[#0b1c30] flex items-center justify-center p-4"
    style="font-family: Inter, sans-serif;">
    <main class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-xl sm:p-10">
        <div class="mx-auto mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-[#dbe1ff] text-[#004ac6]">
            <span aria-hidden="true" class="material-symbols-outlined">check_circle</span>
        </div>
        <h1 class="mb-3 text-2xl font-semibold">Password updated</h1>
        <p class="mb-8 text-sm leading-6 text-[#434655]">
            Your password has been changed. Sign in with your new password to continue.
        </p>
        <a class="inline-flex h-12 w-full items-center justify-center rounded-lg bg-[#004ac6] font-medium text-white transition-colors hover:bg-[#2563eb]"
            href="{% url 'accounts:login' %}">Sign in</a>
    </main>
</body>

</html>
