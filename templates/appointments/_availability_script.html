<script>
document.addEventListener("DOMContentLoaded", function () {

    // Find the appointment form on the current page.
    const form = document.querySelector("[data-availability-form]");

    if (!form) {
        return;
    }

    // Booking page has a doctor dropdown.
    // Reschedule page uses a fixed doctor ID from the form.
    const doctorSelect = form.querySelector('[name="doctor"]');
    const fixedDoctorId = form.dataset.doctorId || "";

    const dateSelect = form.querySelector('[name="appointment_date"]');
    const timeSelect = form.querySelector('[name="appointment_time"]');

    const excludeAppointmentId =
        form.dataset.excludeAppointmentId || "";

    const datesUrl = form.dataset.datesUrl;
    const timesUrl = form.dataset.timesUrl;

    const message = document.getElementById("availability-message");

    // Preserve the existing appointment's date and time on reschedule.
    const initialDate = (form.dataset.selectedDate || "").trim();
    const initialTime = (form.dataset.selectedTime || "").trim().slice(0, 5);

    if (!dateSelect || !timeSelect) {
        console.error(
            "Availability form requires appointment_date and appointment_time fields."
        );
        return;
    }

    if (!datesUrl || !timesUrl) {
        console.error("Availability API URLs are missing from the form.");
        showMessage("Availability configuration is missing.");
        return;
    }

    if (!doctorSelect && !fixedDoctorId) {
        console.error("No doctor dropdown or fixed doctor ID was found.");
        showMessage("Doctor information is missing.");
        return;
    }

    let requestNumber = 0;

    function showMessage(text) {
        if (message) {
            message.textContent = text;
        }
    }

    function resetSelect(select, placeholder, disabled = true) {
        select.innerHTML = "";

        const option = document.createElement("option");
        option.value = "";
        option.textContent = placeholder;

        select.appendChild(option);
        select.disabled = disabled;
    }

    function addOptions(
        select,
        items,
        placeholder,
        selectedValue = ""
    ) {
        resetSelect(select, placeholder, false);

        items.forEach(function (item) {
            const option = document.createElement("option");

            option.value = String(item.value);
            option.textContent = item.label;

            if (String(item.value) === String(selectedValue)) {
                option.selected = true;
            }

            select.appendChild(option);
        });

        if (items.length === 0) {
            resetSelect(select, placeholder, true);
        }
    }

    function getDoctorId() {
        if (doctorSelect) {
            return doctorSelect.value || "";
        }

        return fixedDoctorId;
    }

    function buildApiUrl(baseUrl) {
        return new URL(baseUrl, window.location.origin);
    }

    async function fetchJson(url) {
        const response = await fetch(url, {
            method: "GET",
            headers: {
                "X-Requested-With": "XMLHttpRequest",
                "Accept": "application/json"
            }
        });

        if (!response.ok) {
            const responseText = await response.text();

            console.error(
                "Availability API error:",
                response.status,
                responseText
            );

            throw new Error(
                "The server could not load availability (HTTP " +
                response.status +
                ")."
            );
        }

        return response.json();
    }

    // Load dates for the selected/fixed doctor.
    async function loadDates(selectedDate = "", selectedTime = "") {

        const doctorId = getDoctorId();
        const currentRequest = ++requestNumber;

        resetSelect(
            dateSelect,
            "Loading available dates...",
            true
        );

        resetSelect(
            timeSelect,
            "Select a date first",
            true
        );

        if (!doctorId) {
            resetSelect(
                dateSelect,
                "Select a doctor first",
                true
            );

            showMessage("Select a doctor to see available dates.");
            return;
        }

        showMessage("Loading available dates...");

        try {
            const url = buildApiUrl(datesUrl);

            url.searchParams.set("doctor_id", doctorId);

            // Needed when the date API supports excluding
            // the current appointment during rescheduling.
            if (excludeAppointmentId) {
                url.searchParams.set(
                    "exclude_appointment_id",
                    excludeAppointmentId
                );
            }

            const data = await fetchJson(url);

            if (currentRequest !== requestNumber) {
                return;
            }

            const dates = Array.isArray(data.dates) ? data.dates : [];

            addOptions(
                dateSelect,
                dates,
                "Select an available date",
                selectedDate
            );

            if (dates.length === 0) {
                resetSelect(
                    dateSelect,
                    "No available dates",
                    true
                );

                resetSelect(
                    timeSelect,
                    "No available times",
                    true
                );

                showMessage(
                    data.message ||
                    "No available dates found for this doctor."
                );

                return;
            }

            const selectedDateExists = dates.some(function (item) {
                return String(item.value) === String(selectedDate);
            });

            if (selectedDate && selectedDateExists) {
                dateSelect.value = selectedDate;

                await loadTimes(selectedDate, selectedTime);
            } else {
                dateSelect.value = "";

                resetSelect(
                    timeSelect,
                    "Select a date first",
                    true
                );

                if (selectedDate) {
                    showMessage(
                        "Your existing date is not currently available. Please choose another date."
                    );
                } else {
                    showMessage(
                        "Select a date to see available time slots."
                    );
                }
            }

        } catch (error) {
            if (currentRequest !== requestNumber) {
                return;
            }

            resetSelect(
                dateSelect,
                "Unable to load dates",
                true
            );

            resetSelect(
                timeSelect,
                "Select a date first",
                true
            );

            showMessage(
                "Could not load available dates. Refresh the page and try again."
            );

            console.error(error);
        }
    }

    // Load available time slots for a selected date.
    async function loadTimes(selectedDate, selectedTime = "") {

        const doctorId = getDoctorId();

        if (!doctorId || !selectedDate) {
            resetSelect(
                timeSelect,
                "Select a date first",
                true
            );
            return;
        }

        const currentRequest = ++requestNumber;

        resetSelect(
            timeSelect,
            "Loading available times...",
            true
        );

        showMessage("Loading available time slots...");

        try {
            const url = buildApiUrl(timesUrl);

            url.searchParams.set("doctor_id", doctorId);
            url.searchParams.set("date", selectedDate);

            if (excludeAppointmentId) {
                url.searchParams.set(
                    "exclude_appointment_id",
                    excludeAppointmentId
                );
            }

            const data = await fetchJson(url);

            if (currentRequest !== requestNumber) {
                return;
            }

            const times = Array.isArray(data.times) ? data.times : [];

            addOptions(
                timeSelect,
                times,
                "Select an available time",
                selectedTime
            );

            if (times.length === 0) {
                resetSelect(
                    timeSelect,
                    "No available times",
                    true
                );

                showMessage(
                    data.message ||
                    "No available time slots for this date. Please choose another date."
                );

                return;
            }

            const selectedTimeExists = times.some(function (item) {
                return String(item.value).slice(0, 5) ===
                    String(selectedTime).slice(0, 5);
            });

            if (selectedTime && selectedTimeExists) {
                timeSelect.value = selectedTime;
            } else {
                timeSelect.value = "";

                if (selectedTime) {
                    showMessage(
                        "Your existing time is unavailable. Please choose another time."
                    );
                    return;
                }
            }

            showMessage("Available time slots loaded.");

        } catch (error) {
            if (currentRequest !== requestNumber) {
                return;
            }

            resetSelect(
                timeSelect,
                "Unable to load times",
                true
            );

            showMessage(
                "Could not load time slots. Please try again."
            );

            console.error(error);
        }
    }

    // Booking page: reload dates when doctor changes.
    if (doctorSelect) {
        doctorSelect.addEventListener("change", function () {
            loadDates();
        });
    }

    // Both pages: reload times when the date changes.
    dateSelect.addEventListener("change", function () {

        const selectedDate = dateSelect.value;

        if (!selectedDate) {
            resetSelect(
                timeSelect,
                "Select a date first",
                true
            );

            showMessage("Select a date to see available times.");
            return;
        }

        loadTimes(selectedDate);
    });

    // Initial load:
    // Booking page waits for a doctor selection.
    // Reschedule page already has a fixed doctor ID.
    if (getDoctorId()) {
        loadDates(initialDate, initialTime);
    } else {
        resetSelect(
            dateSelect,
            "Select a doctor first",
            true
        );

        resetSelect(
            timeSelect,
            "Select a date first",
            true
        );

        showMessage("Select a doctor to see available dates.");
    }

});
</script>
